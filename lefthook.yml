pre-commit:
  parallel: true
  commands:
    format:
      glob: '*.{ts,tsx,js,json,md,yml,yaml,css}'
      run: pnpm exec prettier --check {staged_files}
    lint:
      glob: '*.{ts,tsx,js}'
      run: pnpm exec eslint --max-warnings 0 --no-warn-ignored {staged_files}
    typecheck:
      glob: '*.{ts,tsx}'
      run: pnpm typecheck

commit-msg:
  commands:
    commitlint:
      run: pnpm exec commitlint --edit {1}
